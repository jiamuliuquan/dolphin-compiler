name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # macOS 暂缓：Rust 1.96+ 在 aarch64-apple-darwin 上把 rust-lld 改为动态
          # 链接 @rpath/libLLVM.dylib，但 rustup 分发的工具链未把它放到 rust-lld
          # 可解析的位置（上游 rust-lang/rust#151063 的 follow-up 尚未完全修复），
          # 导致发行包里的 rust-lld 运行时报 "Library not loaded: @rpath/libLLVM.dylib"。
          # 待上游修复或实现「发行包携带 libLLVM.dylib」后再恢复 macOS 冒烟测试。
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Windows runner 的 `cl` 默认不在 PATH，需先激活 MSVC 环境，供 build.rs
      # 编译运行时使用（这也是「构建编译器本身需要 C 编译器」的体现）。
      - name: Activate MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --bins

      # 打包自包含发行包（dc + dolphin-compiler + rust-lld + 许可证 + 文档）。
      - name: Package release archive
        run: python scripts/package.py --target ${{ matrix.target }}

      # 冒烟测试：解压发行包，从空目录构建并运行示例（不依赖系统 C 编译器）。
      - name: Smoke test the release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          zip=$(ls dist/dolphin-*.zip 2>/dev/null | head -1)
          tar=$(ls dist/dolphin-*.tar.gz 2>/dev/null | head -1)
          if [ -n "$zip" ]; then
            unzip -q "$zip" -d smoke
          elif [ -n "$tar" ]; then
            tar xzf "$tar" -C smoke
          else
            echo "no release archive found in dist/" >&2
            exit 1
          fi
          smoke/dc build examples/m8 --release
          set +e
          ./examples/m8/target/m8
          code=$?
          set -e
          test "$code" -eq 64
