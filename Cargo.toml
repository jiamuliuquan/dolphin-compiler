[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5.50", features = ["derive"] }
cranelift-codegen = "0.134.2"
cranelift-frontend = "0.134.2"
cranelift-module = "0.134.2"
cranelift-object = "0.134.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
target-lexicon = "0.13.5"
toml = "1.1.5"
ureq = "3.4.2"
url = "2.5.8"
zip = { version = "8", default-features = false, features = ["deflate"] }

dolphin-source = { path = "crates/dolphin-source" }
dolphin-syntax = { path = "crates/dolphin-syntax" }
dolphin-ir = { path = "crates/dolphin-ir" }
dolphin-package = { path = "crates/dolphin-package" }
dolphin-platform = { path = "crates/dolphin-platform" }
dolphin-hir = { path = "crates/dolphin-hir" }
dolphin-backend = { path = "crates/dolphin-backend" }
dolphin-codegen-cranelift = { path = "crates/dolphin-codegen-cranelift" }
dolphin-codegen-llvm = { path = "crates/dolphin-codegen-llvm" }
dolphin-linker = { path = "crates/dolphin-linker" }
dolphin-std = { path = "crates/dolphin-std" }
dolphin-driver = { path = "crates/dolphin-driver", default-features = false }
dolphin-format = { path = "crates/dolphin-format" }
dolphin-lsp = { path = "crates/dolphin-lsp" }

[package]
name = "dolphin-compiler"
version.workspace = true
edition.workspace = true

[dependencies]
clap.workspace = true
dolphin-driver.workspace = true
dolphin-format.workspace = true
dolphin-lsp.workspace = true

[features]
default = ["cranelift"]
cranelift = ["dolphin-driver/cranelift"]
llvm = ["dolphin-driver/llvm"]
